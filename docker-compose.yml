services:
  shady-url:
    build: .
    container_name: shady-url
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.shady-url.rule=Host(`url.marcel.co.nz`) || Host(`7xsecurepay6g-wallet.marcel.co.nz`)"
        - "traefik.http.routers.shady-url.entrypoints=websecure"
        - "traefik.http.routers.shady-url.tls=true"
        - "traefik.http.routers.shady-url.tls.certresolver=myresolver"
        - "traefik.http.services.shady-url.loadbalancer.server.port=8000"
        
        - "traefik.http.middlewares.shady-url-ratelimit.ratelimit.average=1"
        - "traefik.http.middlewares.shady-url-ratelimit.ratelimit.burst=5"

        - "traefik.http.middlewares.shady-url-buffer.buffering.maxRequestBodyBytes=5242880"

        - "traefik.http.routers.shady-url.middlewares=shady-url-ratelimit,shady-url-buffer"
    networks:
      - proxy
      - redis
  
networks:
  proxy:
    external: true
  redis:
    external: true
